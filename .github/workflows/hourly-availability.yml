name: Stock Scanner hourly availability

on:
  workflow_dispatch:
  schedule:
    - cron: "11 * * * *"

permissions:
  contents: read

concurrency:
  group: kabulens-hourly-availability
  cancel-in-progress: true

jobs:
  public-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python .github/scripts/check_public_surface.py https://hanksleekorea-boop.github.io/kabulens-public-web/
